name: 先生晨报
on:
  schedule:
    - cron: '0 0 * * 1-5'   # 北京时间 08:00，周一至周五
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 采集行情与消息
        run: python fetch.py
      - name: 提交报告
        run: |
          git config user.name "lfmmp531"
          git config user.email "lfmmp531@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "晨报 $(date +%Y-%m-%d)"
          git push